<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流工具箱 - 首页 (工作流真实联动版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== 基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        body { background: #f0f3f7; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* 左侧导航 */
        .sidebar { width: 280px; min-width: 280px; background: linear-gradient(180deg, #1e3a5f 0%, #0f2b44 100%); color: #e0eefa; display: flex; flex-direction: column; box-shadow: 2px 0 16px rgba(0,0,0,0.15); z-index: 10; }
        .sidebar-brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-brand h1 { font-size: 20px; font-weight: 700; color: #f9e0a8; display: flex; align-items: center; gap: 10px; }
        .sidebar-brand p { font-size: 12px; opacity: 0.6; margin-top: 4px; }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0 20px; }
        .nav-section { margin-bottom: 6px; }
        .nav-section-title { padding: 8px 20px 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.35); cursor: pointer; user-select: none; display: flex; justify-content: space-between; }
        .nav-section-title .arrow { transition: transform 0.2s; }
        .nav-section-title .arrow.collapsed { transform: rotate(-90deg); }
        .nav-items { overflow: hidden; transition: max-height 0.3s ease; }
        .nav-items.collapsed { max-height: 0 !important; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 20px 9px 32px; cursor: pointer; transition: 0.15s; border-left: 3px solid transparent; font-size: 14px; color: rgba(255,255,255,0.7); text-decoration: none; }
        .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-item.active { background: rgba(255,255,255,0.10); border-left-color: #ffb347; color: #fff; }
        .nav-item .icon { font-size: 16px; width: 22px; text-align: center; }
        .nav-item.workflow-item { border-left-color: #f5d742; background: rgba(245,215,66,0.08); }
        .nav-item.workflow-item .badge { background: #f5d742; color: #1e3a5f; margin-left: auto; padding: 1px 10px; border-radius: 30px; font-size: 10px; }

        /* 右侧主内容 */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f0f3f7; }
        .content-header { background: white; padding: 16px 28px; border-bottom: 1px solid #e2edf5; display: flex; justify-content: space-between; align-items: center; min-height: 64px; z-index: 10; }
        .content-header h2 { font-size: 18px; font-weight: 600; color: #1f3a5f; }
        .content-header .logout-top { background: rgba(26,93,140,0.08); border: 1px solid #cbdde9; padding: 6px 18px; border-radius: 30px; font-size: 13px; color: #1a5d8c; cursor: pointer; }
        .content-body { flex: 1; overflow: hidden; padding: 16px 20px; background: #f0f3f7; position: relative; min-height: 0; height: 100%; }

        /* 常规工具嵌入 iframe */
        .iframe-wrapper { width: 100%; height: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #e2edf5; position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }
        .iframe-wrapper iframe { width: 100%; height: 100%; border: none; display: block; flex: 1; }

        /* 工作流覆盖面板 */
        .workflow-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; border-radius: 12px; }
        .workflow-overlay.active { display: flex; }
        .workflow-panel { background: white; border-radius: 1.2rem; max-width: 720px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 24px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideUp 0.3s ease; }
        .workflow-panel .wf-title { font-size: 18px; font-weight: 700; color: #1f3a5f; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #e8eef5; padding-bottom: 12px; }
        .wf-steps { margin: 16px 0; }
        .wf-step { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid #f0f4f8; }
        .wf-step .step-num { width: 28px; height: 28px; border-radius: 50%; background: #e8eef5; color: #4a6a8a; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .wf-step.done .step-num { background: #2a7f6e; color: white; }
        .wf-step .step-info { flex: 1; }
        .wf-step .step-info .step-name { font-weight: 600; color: #1f3a5f; font-size: 14px; }
        .wf-step .step-info .step-status { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
        .wf-step .step-info .step-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .wf-step .step-info .step-status .dot.done { background: #2a7f6e; }
        .wf-step .step-action .btn { border: none; padding: 4px 14px; border-radius: 60px; font-weight: 600; font-size: 11px; cursor: pointer; }
        .wf-step .step-action .btn-success { background: #2a7f6e; color: white; }
        .wf-footer { display: flex; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e8eef5; }
        .wf-footer .btn { border: none; padding: 8px 24px; border-radius: 60px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .wf-footer .btn-success { background: #2a7f6e; color: white; }
        .wf-footer .btn-danger { background: #fce4e4; color: #b13b3b; border: 1px solid #f5c2c2; }
        .wf-log { background: #0f1a24; border-radius: 8px; padding: 8px 12px; max-height: 80px; overflow-y: auto; margin-top: 12px; font-family: monospace; font-size: 11px; color: #c9e1f0; }
        
        /* 工具全屏弹窗（工作流执行时使用） */
        .tool-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .tool-modal-overlay.active { display: flex; }
        .tool-modal-box { width: 95%; height: 95%; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .tool-modal-header { height: 45px; background: #f8fafd; border-bottom: 1px solid #e2edf5; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
        .tool-modal-header .close-btn { border: 1px solid #f5c2c2; background: #fce4e4; color: #b13b3b; padding: 4px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; }
        .tool-modal-box iframe { width: 100%; flex: 1; border: none; min-height: 0; }

        /* 常规欢迎页 */
        .welcome-content { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 40px; background: white; border-radius: 12px; border: 1px solid #e2edf5; overflow-y: auto; }
        .welcome-content .tool-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; justify-content: center; }
        .welcome-content .tool-grid .card { background: #f8fafd; border: 1px solid #e2edf5; border-radius: 12px; padding: 16px 24px; cursor: pointer; transition: 0.2s; }
        .welcome-content .tool-grid .card:hover { border-color: #1a5d8c; transform: translateY(-2px); }
        
        /* 工作流选择页 */
        .workflow-list-page { padding: 20px; height: 100%; overflow-y: auto; }
        .workflow-card { background: white; border-radius: 14px; border: 1px solid #e2edf5; padding: 20px; margin-bottom: 16px; cursor: pointer; transition: 0.2s; }
        .workflow-card:hover { border-color: #f5d742; transform: translateY(-2px); }
        .workflow-card .wf-name { font-size: 18px; font-weight: 700; color: #1f3a5f; }
        .workflow-card .wf-desc { font-size: 14px; color: #7a8eaa; margin-top: 8px; }
        .workflow-card .wf-action { margin-top: 12px; display: inline-block; background: #f5d742; color: #1e3a5f; font-size: 10px; font-weight: 700; padding: 2px 12px; border-radius: 30px; }

        .copy-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2a7f6e; color: white; padding: 10px 24px; border-radius: 60px; font-weight: 600; z-index: 3000; display: none; }
        .copy-toast.show { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧导航 -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand"><h1>📦 物流工具箱</h1><p>Logistics Toolbox</p></div>
            <div class="sidebar-nav" id="sidebarNav"></div>
        </nav>

        <!-- 右侧内容区 -->
        <main class="main-content">
            <header class="content-header">
                <h2 id="pageTitle">📦 物流工具箱</h2>
                <button class="logout-top" id="logoutTopBtn">🚪 退出登录</button>
            </header>

            <div class="content-body" id="contentBody">
                <!-- 工作流步骤面板 -->
                <div class="workflow-overlay" id="workflowOverlay">
                    <div class="workflow-panel" id="workflowPanel"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 工具全屏执行弹窗 -->
    <div id="toolModalOverlay" class="tool-modal-overlay"></div>

    <script>
        // ============================================================
        //  全局配置
        // ============================================================
        var TOOLS = [
            { id: 'welcome', icon: '🏠', label: '首页', section: '导航', isWelcome: true },
            { id: 'workflow', icon: '⚡', label: '一键串联', section: '导航', isWorkflow: true },
            { id: 'address-geocode', icon: '📍', label: '地址转经纬度', section: '地理编码', file: 'address-geocode.html' },
            { id: 'kmeans-cluster', icon: '🧠', label: 'K-Means聚类', section: '智能规划', file: 'kmeans-cluster.html' },
            { id: 'route-distance', icon: '🗺️', label: '线路排程', section: '路线规划', file: 'route-distance.html' }
        ];

        var WORKFLOWS = [{
            id: 'address-to-cluster',
            name: '地址→经纬度→聚类',
            description: '上传地址文件 → 解析经纬度 → 自动导入聚类工具进行分组',
            steps: [
                { tool: 'address-geocode', label: '地址转经纬度', desc: '上传Excel文件，批量查询经纬度坐标' },
                { tool: 'kmeans-cluster', label: 'K-Means聚类', desc: '自动导入经纬度数据，按容量约束分组' }
            ]
        }];

        var PASS_KEY = 'toolbox_data_pass';
        var workflowState = { isRunning: false, currentStep: 0, results: {}, errors: [], logs: [], workflow: null };

        // ============================================================
        //  主渲染逻辑
        // ============================================================
        function renderNav() {
            var nav = document.getElementById('sidebarNav');
            var html = '';
            for (var i = 0; i < TOOLS.length; i++) {
                var t = TOOLS[i];
                html += `<a class="nav-item ${t.isWorkflow ? 'workflow-item' : ''}" href="#" onclick="loadTool('${t.id}')">
                            <span class="icon">${t.icon}</span><span>${t.label}</span>
                         </a>`;
            }
            nav.innerHTML = html;
        }

        function loadTool(toolId) {
            if (workflowState.isRunning) {
                alert('工作流正在执行中，请先完成或取消工作流！');
                return;
            }
            var body = document.getElementById('contentBody');
            body.innerHTML = '';

            if (toolId === 'welcome') {
                body.innerHTML = `
                    <div class="welcome-content">
                        <div class="logo-big" style="font-size: 72px;">📦</div>
                        <h2 style="font-size: 28px; color: #1f3a5f;">物流工具箱</h2>
                        <p style="color: #7a8eaa;">点击左侧菜单选择工具，或点击「一键串联」执行自动化工作流。</p>
                    </div>`;
            } else if (toolId === 'workflow') {
                var container = document.createElement('div');
                container.className = 'workflow-list-page';
                var cardsHtml = WORKFLOWS.map(wf => `
                    <div class="workflow-card" onclick="startWorkflow('${wf.id}')">
                        <div class="wf-name">${wf.name}</div>
                        <div class="wf-desc">${wf.description}</div>
                        <div class="wf-action">🚀 点击执行</div>
                    </div>`).join('');
                container.innerHTML = `<h2 style="margin-bottom:16px;">⚡ 一键串联</h2>${cardsHtml}`;
                body.appendChild(container);
            } else {
                // 加载普通工具
                var tool = TOOLS.find(t => t.id === toolId);
                if (!tool || !tool.file) return;

                var wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';
                
                var iframe = document.createElement('iframe');
                iframe.src = tool.file;
                iframe.allow = 'geolocation';
                wrapper.appendChild(iframe);
                body.appendChild(wrapper);
                
                document.getElementById('pageTitle').textContent = tool.icon + ' ' + tool.label;
            }
        }

        // ============================================================
        //  ★★★ 工作流核心执行逻辑 ★★★
        // ============================================================
        function startWorkflow(workflowId) {
            var workflow = WORKFLOWS.find(w => w.id === workflowId);
            if (!workflow) return;

            workflowState.isRunning = true;
            workflowState.currentStep = 0;
            workflowState.results = {};
            workflowState.logs = [];
            workflowState.workflow = workflow;
            localStorage.removeItem(PASS_KEY); // 清空旧的传递数据

            document.getElementById('contentBody').innerHTML = ''; // 清空主页

            var overlay = document.getElementById('workflowOverlay');
            overlay.classList.add('active');
            renderWorkflowPanel(workflow);

            setTimeout(function() { executeStep(0); }, 400);
        }

        function renderWorkflowPanel(workflow) {
            var panel = document.getElementById('workflowPanel');
            var stepsHtml = '';
            for (var i = 0; i < workflow.steps.length; i++) {
                var step = workflow.steps[i];
                stepsHtml += `
                    <div class="wf-step" id="wfStep_${i}">
                        <div class="step-num">${i + 1}</div>
                        <div class="step-info">
                            <div class="step-name">${step.label}</div>
                            <div class="step-desc">${step.desc}</div>
                            <div class="step-status"><span class="dot pending"></span><span class="status-text">等待执行</span></div>
                        </div>
                    </div>`;
            }

            panel.innerHTML = `
                <div class="wf-title">⚡ ${workflow.name}</div>
                <div class="wf-steps">${stepsHtml}</div>
                <div class="wf-log" id="wfLog"></div>
                <div class="wf-footer">
                    <button class="btn btn-danger" onclick="cancelWorkflow()">✕ 取消</button>
                    <button class="btn btn-success" id="wfNextBtn" disabled>⏳ 等待当前步骤...</button>
                </div>`;
        }

        function addWorkflowLog(msg, type) {
            if (!type) type = 'info';
            var container = document.getElementById('wfLog');
            if (container) {
                container.innerHTML += `<div style="color:${type === 'error' ? '#ffb4a2' : '#b9e0ff'}">${new Date().toLocaleTimeString()} - ${msg}</div>`;
                container.scrollTop = container.scrollHeight;
            }
        }

        function updateStepUI(idx, status, text) {
            var stepEl = document.getElementById('wfStep_' + idx);
            if (!stepEl) return;
            stepEl.className = 'wf-step ' + status;
            stepEl.querySelector('.status-text').textContent = text;
            stepEl.querySelector('.dot').className = 'dot ' + status;
        }

        // ★★★ 核心：执行步骤（弹窗模式） ★★★
        function executeStep(idx) {
            var workflow = workflowState.workflow;
            var step = workflow.steps[idx];
            var tool = TOOLS.find(t => t.id === step.tool);

            if (!tool) return;

            workflowState.currentStep = idx;
            updateStepUI(idx, 'running', '执行中...');
            addWorkflowLog(`📌 正在弹出工具: ${tool.label}`);

            // 激活工具全屏弹窗
            var toolModalOverlay = document.getElementById('toolModalOverlay');
            toolModalOverlay.innerHTML = '';
            toolModalOverlay.classList.add('active');

            var modalBox = document.createElement('div');
            modalBox.className = 'tool-modal-box';
            
            var header = document.createElement('div');
            header.className = 'tool-modal-header';
            header.innerHTML = `<span style="font-weight:600;">${tool.icon} ${tool.label} (步骤 ${idx + 1}/${workflow.steps.length})</span>`;
            var closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.innerText = '✕ 关闭';
            closeBtn.onclick = function() {
                if (confirm('确定要关闭当前工具吗？')) {
                    toolModalOverlay.classList.remove('active');
                    updateStepUI(idx, 'pending', '等待执行');
                }
            };
            header.appendChild(closeBtn);
            modalBox.appendChild(header);

            var iframe = document.createElement('iframe');
            iframe.src = tool.file;
            iframe.allow = 'geolocation';
            modalBox.appendChild(iframe);
            toolModalOverlay.appendChild(modalBox);

            // 监听子工具完成的消息
            var messageHandler = function(event) {
                if (event.data && event.data.type === 'toolbox_data_saved' && event.data.tool === step.tool) {
                    addWorkflowLog(`✅ ${tool.label} 数据已保存 (${event.data.count} 条)`, 'success');
                    
                    // 标记本步骤为完成
                    updateStepUI(idx, 'done', '✅ 已完成');
                    workflowState.results[step.tool] = event.data;

                    // 自动关闭当前工具弹窗
                    setTimeout(function() {
                        toolModalOverlay.classList.remove('active');
                        addWorkflowLog(`✅ 步骤 ${idx + 1} 完成`, 'success');
                        
                        // 如果所有步骤都完成了，激活“完成”按钮
                        if (idx === workflow.steps.length - 1) {
                            var nextBtn = document.getElementById('wfNextBtn');
                            nextBtn.textContent = '🎉 工作流完成!';
                            nextBtn.disabled = false;
                            nextBtn.onclick = function() {
                                closeWorkflow('完成');
                            };
                        } else {
                            var nextBtn = document.getElementById('wfNextBtn');
                            nextBtn.textContent = '▶ 执行下一步';
                            nextBtn.disabled = false;
                            nextBtn.onclick = function() {
                                executeStep(idx + 1);
                            };
                        }
                    }, 800);

                    window.removeEventListener('message', messageHandler);
                }
            };
            window.addEventListener('message', messageHandler);

            addWorkflowLog('请完成工具操作，完成后将自动跳转下一步', 'info');
        }

        // 取消工作流
        function cancelWorkflow() {
            if (confirm('确定要取消工作流吗？')) {
                closeWorkflow('已取消');
            }
        }

        // ============================================================
        //  ★★★ 修复：关闭工作流并保留结果的展示 ★★★
        // ============================================================
        function closeWorkflow(reason) {
            document.getElementById('workflowOverlay').classList.remove('active');
            document.getElementById('toolModalOverlay').classList.remove('active');

            workflowState.isRunning = false;
            workflowState.currentStep = 0;
            workflowState.results = {};
            workflowState.workflow = null;

            document.getElementById('pageTitle').textContent = '📦 物流工具箱';

            // ★★★ 核心修改：点击“完成”后，强制加载聚类工具（最后一步），而不是回到首页 ★★★
            if (reason === '完成') {
                // 这里必须确保加载的是工作流的最后一个工具（比如聚类工具）
                loadTool('kmeans-cluster'); 
            } else {
                // 如果取消，则回到首页
                loadTool('welcome');
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        document.getElementById('logoutTopBtn').addEventListener('click', function() {
            alert('退出登录');
        });

        window.loadTool = loadTool;
        window.startWorkflow = startWorkflow;
        window.cancelWorkflow = cancelWorkflow;

        renderNav();
        loadTool('welcome');
    </script>
</body>
</html>
